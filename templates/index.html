<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Maktab Ovozi</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #111827;
      --input-bg: #0f172a;
      --border-color: #2563eb;
      --border-glow: rgba(37, 99, 235, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-placeholder: #64748b;
      --btn-bg: #1e3a5f;
      --btn-bg-hover: #254b7d;
      --btn-bg-active: #172d4a;
      --btn-text: #ffffff;
      --accent-blue: #38bdf8;
      --danger-color: #ef4444;
      --success-color: #22c55e;
      --radius-card: 16px;
      --radius-btn: 26px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 32px 20px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 24px;
    }

    .logo-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo-icon {
      font-size: 32px;
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    }

    .app-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .app-subtitle {
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--text-muted);
      max-width: 320px;
      margin: 0 auto;
    }

    /* Main Form */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Input Card */
    .input-card {
      background-color: var(--input-bg);
      border: 1.8px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 16px 16px 12px 16px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 15px var(--border-glow);
      display: flex;
      flex-direction: column;
    }

    .input-card:focus-within {
      border-color: #3b82f6;
      box-shadow: 0 4px 24px rgba(37, 99, 235, 0.35), 0 0 20px rgba(59, 130, 246, 0.3);
    }

    .message-textarea {
      width: 100%;
      min-height: 160px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text-main);
      user-select: text;
      -webkit-user-select: text;
    }

    .message-textarea::placeholder {
      color: var(--text-placeholder);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .anon-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .anon-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #38bdf8;
      box-shadow: 0 0 6px #38bdf8;
    }

    .anon-text {
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .char-counter {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Attachments */
    .attachment-section {
      margin-top: 18px;
    }

    .attachment-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .attach-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 8px 14px;
      color: var(--text-main);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .attach-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .attach-btn:active {
      transform: translateY(0);
      background: rgba(255, 255, 255, 0.04);
    }

    .btn-icon {
      font-size: 16px;
      line-height: 1;
    }

    .attachment-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: auto;
    }

    /* Files Preview */
    .files-preview-container {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .preview-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .clear-all-btn {
      background: none;
      border: none;
      color: var(--danger-color);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 2px 6px;
    }

    .clear-all-btn:hover {
      text-decoration: underline;
    }

    .files-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .files-grid::-webkit-scrollbar {
      width: 4px;
    }
    .files-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .file-thumb {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      background: #1e293b;
      flex-shrink: 0;
    }

    .file-doc-icon {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .file-remove-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-muted);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .file-remove-btn:hover {
      background: var(--danger-color);
      color: #fff;
    }

    /* Submit Button */
    .submit-section {
      margin-top: 28px;
    }

    .submit-btn {
      width: 100%;
      height: 52px;
      background-color: var(--btn-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-btn);
      color: var(--btn-text);
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }

    .submit-btn:hover:not(:disabled) {
      background-color: var(--btn-bg-hover);
      transform: translateY(-1.5px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    .submit-btn:active:not(:disabled) {
      background-color: var(--btn-bg-active);
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(20%);
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .submit-btn.loading .spinner {
      display: inline-block;
    }

    /* Success Modal */
    .result-modal {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 23, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      background: #131d2e;
      border: 1px solid rgba(59, 130, 246, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes scaleUp {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success-icon-wrapper {
      margin: 0 auto 18px;
      width: 64px;
      height: 64px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .secondary-btn, .close-web-btn {
      width: 100%;
      height: 46px;
      border-radius: 23px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .secondary-btn:hover { background: rgba(255, 255, 255, 0.14); }

    .close-web-btn {
      background: var(--btn-bg);
    }
    .close-web-btn:hover { background: var(--btn-bg-hover); }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 200;
      width: 90%;
      max-width: 400px;
      pointer-events: none;
    }

    .toast {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    .toast.toast-error { border-color: rgba(239, 68, 68, 0.4); background: #201318; }
    .toast.toast-success { border-color: rgba(34, 197, 94, 0.4); background: #0f241a; }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- Header -->
    <header class="header">
      <div class="logo-wrapper">
        <span class="logo-icon">🎓</span>
        <h1 class="app-title">Maktab Ovozi</h1>
      </div>
      <p class="app-subtitle">
        Loyiha yoki taklifingizni yozing. Ismingiz hech kimga ko&#8216;rinmaydi 🔒
      </p>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <form id="suggestionForm" autocomplete="off" onsubmit="return false;">
        
        <!-- Textarea Card -->
        <div class="input-card" id="inputCard">
          <textarea 
            id="messageInput" 
            class="message-textarea" 
            placeholder="Xabaringizni yozing..." 
            maxlength="1000" 
            rows="6"
            spellcheck="false"
          ></textarea>
          
          <div class="card-footer">
            <div class="anon-badge">
              <span class="anon-dot"></span>
              <span class="anon-text">Anonim</span>
            </div>
            <div class="char-counter">
              <span id="charCount">0</span> / 1000
            </div>
          </div>
        </div>

        <!-- Attachments Section -->
        <div class="attachment-section">
          <div class="attachment-actions">
            <label class="attach-btn" for="photoInput" title="Rasm yuklash">
              <span class="btn-icon">📷</span>
              <span class="btn-text">Rasm</span>
            </label>
            <input type="file" id="photoInput" accept="image/*" multiple hidden>

            <label class="attach-btn" for="fileInput" title="Fayl yuklash">
              <span class="btn-icon">📁</span>
              <span class="btn-text">Fayl</span>
            </label>
            <input type="file" id="fileInput" multiple hidden>
            
            <span class="attachment-hint" id="attachHint">Rasm yoki fayl qo‘yish</span>
          </div>

          <!-- Files Preview -->
          <div class="files-preview-container" id="filesPreviewContainer" style="display: none;">
            <div class="preview-header">
              <span class="preview-title">Biriktirilgan fayllar (<span id="fileCountBadge">0</span>)</span>
              <button type="button" class="clear-all-btn" id="clearAllFilesBtn">Tozalash</button>
            </div>
            <div class="files-grid" id="filesGrid"></div>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="submit-section">
          <button type="button" class="submit-btn" id="submitBtn">
            <span class="btn-text" id="submitBtnText">Yuborish</span>
            <span class="spinner" id="submitSpinner"></span>
          </button>
        </div>

      </form>

      <!-- Success Screen -->
      <div class="result-modal" id="resultModal" style="display: none;">
        <div class="modal-card">
          <div class="success-icon-wrapper">
            <span style="font-size: 50px;">✅</span>
          </div>
          <h2 class="modal-title">Xabaringiz yuborildi!</h2>
          <p class="modal-desc">
            Taklif va tashabbusingiz uchun tashakkur. Xabaringiz to&#8216;liq anonim holda qabul qilindi 🔒
          </p>
          <div class="modal-actions">
            <button type="button" class="secondary-btn" id="newFeedbackBtn">Yana xabar yuborish</button>
            <button type="button" class="close-web-btn" id="closeWebAppBtn">Yopish</button>
          </div>
        </div>
      </div>

      <!-- Toast Container -->
      <div class="toast-container" id="toastContainer"></div>

    </main>

  </div>

  <script>
    const CONFIG = {
      BOT_TOKEN: '9070135329:AAGePTSiRBMBz9l3dQNgan6qU66pPsDgpME',
      ADMIN_CHAT_ID: '6649277063',
      MAX_CHARS: 1000,
      MAX_FILE_SIZE_MB: 50,
      MAX_FILES: 10
    };

    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        tg.enableClosingConfirmation();
      } catch (e) {}
    }

    const messageInput = document.getElementById('messageInput');
    const charCount = document.getElementById('charCount');
    const photoInput = document.getElementById('photoInput');
    const fileInput = document.getElementById('fileInput');
    const filesPreviewContainer = document.getElementById('filesPreviewContainer');
    const fileCountBadge = document.getElementById('fileCountBadge');
    const filesGrid = document.getElementById('filesGrid');
    const clearAllFilesBtn = document.getElementById('clearAllFilesBtn');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const resultModal = document.getElementById('resultModal');
    const newFeedbackBtn = document.getElementById('newFeedbackBtn');
    const closeWebAppBtn = document.getElementById('closeWebAppBtn');
    const toastContainer = document.getElementById('toastContainer');

    let selectedFiles = [];
    let isSubmitting = false;

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function getFormattedDate() {
      const now = new Date();
      return now.toLocaleString('uz-UZ', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function showToast(message, type = 'error') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span><span>${escapeHtml(message)}</span>`;
      toastContainer.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 250);
      }, 4000);
    }

    function haptic(type = 'light') {
      try {
        if (tg?.HapticFeedback) {
          if (type === 'success' || type === 'error') tg.HapticFeedback.notificationOccurred(type);
          else tg.HapticFeedback.impactOccurred(type);
        }
      } catch (e) {}
    }

    function updateState() {
      const currentLength = messageInput.value.length;
      charCount.textContent = currentLength;
      charCount.style.color = currentLength > CONFIG.MAX_CHARS ? '#ef4444' : '';
      const hasContent = messageInput.value.trim().length > 0 || selectedFiles.length > 0;
      submitBtn.disabled = !hasContent || isSubmitting;
    }

    messageInput.addEventListener('input', updateState);

    function handleFiles(fileList) {
      if (!fileList || fileList.length === 0) return;
      const remainingSlots = CONFIG.MAX_FILES - selectedFiles.length;
      if (remainingSlots <= 0) {
        showToast(`Ko‘pi bilan ${CONFIG.MAX_FILES} ta fayl yuklashingiz mumkin.`);
        return;
      }
      const filesToAdd = Array.from(fileList).slice(0, remainingSlots);
      const maxBytes = CONFIG.MAX_FILE_SIZE_MB * 1024 * 1024;
      for (const file of filesToAdd) {
        if (file.size > maxBytes) {
          showToast(`"${file.name}" juda katta. Maksimal: ${CONFIG.MAX_FILE_SIZE_MB}MB`);
          continue;
        }
        selectedFiles.push(file);
      }
      renderFilePreviews();
      updateState();
      haptic('light');
    }

    function renderFilePreviews() {
      if (selectedFiles.length === 0) {
        filesPreviewContainer.style.display = 'none';
        photoInput.value = '';
        fileInput.value = '';
        return;
      }
      filesPreviewContainer.style.display = 'block';
      fileCountBadge.textContent = selectedFiles.length;
      filesGrid.innerHTML = '';

      selectedFiles.forEach((file, index) => {
        const isImage = file.type.startsWith('image/');
        const item = document.createElement('div');
        item.className = 'file-item';

        let mediaHtml = isImage 
          ? `<img src="${URL.createObjectURL(file)}" class="file-thumb" alt="Preview">` 
          : `<div class="file-doc-icon">📁</div>`;

        item.innerHTML = `
          ${mediaHtml}
          <div class="file-info">
            <div class="file-name">${escapeHtml(file.name)}</div>
            <div class="file-size">${formatBytes(file.size)}</div>
          </div>
          <button type="button" class="file-remove-btn" data-index="${index}">✕</button>
        `;
        filesGrid.appendChild(item);
      });

      document.querySelectorAll('.file-remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.getAttribute('data-index'), 10);
          selectedFiles.splice(idx, 1);
          renderFilePreviews();
          updateState();
        });
      });
    }

    clearAllFilesBtn.addEventListener('click', () => {
      selectedFiles = [];
      renderFilePreviews();
      updateState();
    });

    photoInput.addEventListener('change', (e) => handleFiles(e.target.files));
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    async function sendToTelegram() {
      const text = messageInput.value.trim();
      if (!text && selectedFiles.length === 0) return;

      isSubmitting = true;
      submitBtn.disabled = true;
      submitBtn.classList.add('loading');
      submitBtnText.textContent = 'Yuborilmoqda...';
      haptic('medium');

      const dateTime = getFormattedDate();
      const baseCaption = `🎓 <b>Maktab Ovozi — Yangi taklif!</b>\n` +
        `━━━━━━━━━━━━━━━━━━━━━\n` +
        (text ? `💬 <b>Xabar:</b>\n${escapeHtml(text)}\n\n` : `💬 <i>Faqat media fayl yuborildi</i>\n\n`) +
        `📅 <b>Vaqt:</b> ${dateTime}\n` +
        `🔒 <b>Holati:</b> Anonim\n` +
        (selectedFiles.length > 0 ? `📎 <b>Fayllar soni:</b> ${selectedFiles.length} ta\n` : '') +
        `━━━━━━━━━━━━━━━━━━━━━`;

      try {
        if (selectedFiles.length === 0) {
          const res = await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CONFIG.ADMIN_CHAT_ID, text: baseCaption, parse_mode: 'HTML' })
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.description || 'Xatolik');
        } else {
          const photos = selectedFiles.filter(f => f.type.startsWith('image/'));
          const documents = selectedFiles.filter(f => !f.type.startsWith('image/'));
          let captionUsed = false;

          for (let i = 0; i < photos.length; i++) {
            const formData = new FormData();
            formData.append('chat_id', CONFIG.ADMIN_CHAT_ID);
            formData.append('photo', photos[i]);
            if (!captionUsed && baseCaption.length <= 1024) {
              formData.append('caption', baseCaption);
              formData.append('parse_mode', 'HTML');
              captionUsed = true;
            } else {
              formData.append('caption', `📷 Rasm #${i + 1}`);
            }
            await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
          }

          for (let i = 0; i < documents.length; i++) {
            const formData = new FormData();
            formData.append('chat_id', CONFIG.ADMIN_CHAT_ID);
            formData.append('document', documents[i]);
            if (!captionUsed && baseCaption.length <= 1024) {
              formData.append('caption', baseCaption);
              formData.append('parse_mode', 'HTML');
              captionUsed = true;
            } else {
              formData.append('caption', `📁 Hujjat: ${documents[i].name}`);
            }
            await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendDocument`, { method: 'POST', body: formData });
          }

          if (!captionUsed) {
            await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: CONFIG.ADMIN_CHAT_ID, text: baseCaption, parse_mode: 'HTML' })
            });
          }
        }

        haptic('success');
        resultModal.style.display = 'flex';
      } catch (err) {
        haptic('error');
        showToast('Xatolik: ' + err.message);
      } finally {
        isSubmitting = false;
        submitBtn.classList.remove('loading');
        submitBtnText.textContent = 'Yuborish';
        updateState();
      }
    }

    submitBtn.addEventListener('click', sendToTelegram);

    newFeedbackBtn.addEventListener('click', () => {
      resultModal.style.display = 'none';
      messageInput.value = '';
      selectedFiles = [];
      renderFilePreviews();
      updateState();
      messageInput.focus();
    });

    closeWebAppBtn.addEventListener('click', () => {
      if (tg?.close) tg.close();
      else {
        resultModal.style.display = 'none';
        messageInput.value = '';
        selectedFiles = [];
        renderFilePreviews();
        updateState();
      }
    });

    updateState();
  </script>
</body>
</html>
