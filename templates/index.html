<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maktab Ovozi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .card h1 {
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 10px;
        }
        .card p.slogan {
            color: #27ae60;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .info-box {
            background: #eef9f5;
            border-left: 4px solid #27ae60;
            padding: 12px;
            text-align: left;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #333;
        }
        .info-box div {
            margin-bottom: 5px;
        }
        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: none;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        textarea:focus {
            border-color: #27ae60;
        }
        .counter {
            text-align: right;
            font-size: 12px;
            color: #777;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #219150;
        }
        .alert {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
            font-size: 14px;
        }
        .alert.success { background: #d4edda; color: #155724; }
        .alert.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="card">
    <h1>🎓 Maktab Ovozi</h1>
    <p class="slogan">Fikringiz muhim! 💡</p>

    <div class="info-box">
        <div>📩 Loyiha va takliflaringizni anonim yuboring</div>
        <div>🔒 Ismingiz hech kimga ko'rinmaydi</div>
        <div>✅ Xabar to'g'ridan-to'g'ri maktab ma'muriyatiga boradi</div>
    </div>

    <textarea id="message" maxlength="1000" placeholder="Fikr yoki taklifingizni shu yerga yozing (maksimal 1000 belgi)..." oninput="updateCounter()"></textarea>
    <div class="counter"><span id="charCount">0</span> / 1000</div>

    <button onclick="sendAnonMessage()">Yuborish 🚀</button>

    <div id="alert" class="alert"></div>
</div>

<script>
    function updateCounter() {
        const text = document.getElementById('message').value;
        document.getElementById('charCount').innerText = text.length;
    }

    async function sendAnonMessage() {
        const messageInput = document.getElementById('message');
        const alertBox = document.getElementById('alert');
        const text = messageInput.value.trim();

        if (!text) {
            showAlert('Iltimos, xabar kiriting!', 'error');
            return;
        }

        try {
            const response = await fetch('/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();

            if (data.status === 'success') {
                showAlert(data.message, 'success');
                messageInput.value = '';
                updateCounter();
            } else {
                showAlert(data.message, 'error');
            }
        } catch (e) {
            showAlert('Xatolik yuz berdi. Server ishlamayotgan bo\'lishi mumkin.', 'error');
        }
    }

    function showAlert(msg, type) {
        const alertBox = document.getElementById('alert');
        alertBox.className = 'alert ' + type;
        alertBox.innerText = msg;
        alertBox.style.display = 'block';
        setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
    }
</script>

</body>
</html>
